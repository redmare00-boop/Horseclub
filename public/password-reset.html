<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый пароль — Horseclub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <h2>Новый пароль</h2>
      <p class="login-sub">Придумайте пароль не короче 6 символов</p>

      <div id="err" class="login-error" style="display:none"></div>
      <div id="ok" class="login-success" style="display:none"></div>

      <div class="field">
        <label>Новый пароль</label>
        <input type="password" id="new_password" autocomplete="new-password" placeholder="минимум 6 символов">
      </div>

      <div class="field">
        <label>Повтор пароля</label>
        <input type="password" id="new_password2" autocomplete="new-password" placeholder="ещё раз">
      </div>

      <button id="save-btn">Сохранить и войти позже</button>
      <p style="margin-top:14px;font-size:13px">
        <a href="/login.html">На страницу входа</a>
      </p>
    </div>
  </div>

  <script src="password-reset.js"></script>
</body>
</html>
