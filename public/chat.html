<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Чат — Конный клуб</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<script src="nav.js"></script>

<div class="chat-layout">
  <div class="chat-sidebar">
    <div class="chat-sidebar-head">
      <button type="button" class="profile-btn" data-nav-back aria-label="Назад" title="Назад" style="padding:8px 12px;border-radius:12px">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <a href="/" class="back-link" aria-label="Домой" title="Домой">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5.5 9.5V21h13V9.5"></path>
          <path d="M10 21v-7h4v7"></path>
        </svg>
      </a>
      <div class="chat-sidebar-toprow">
        <div class="chat-search-compact">
          <input type="text" id="user-search" placeholder="Найти..." aria-label="Найти">
          <button type="button" class="chat-search-icon" tabindex="-1" aria-hidden="true">⌕</button>
          <div id="search-results" class="search-results"></div>
        </div>
        <button type="button" id="open-user-picker" class="chat-plus" aria-label="Новый чат">+</button>
      </div>
    </div>
    <div class="chat-dialogs" id="dialogs-list"></div>
  </div>

  <div class="chat-main">
    <div class="chat-main-head">
      <button class="chat-back-dialogs" id="back-to-dialogs" type="button" style="display:none">← Чаты</button>
      <div class="chat-main-name" id="chat-title"></div>
    </div>
    <div class="chat-pinned" id="pinned-bar" style="display:none"></div>
    <div class="chat-messages" id="messages-area"></div>
    <div class="chat-attachments-preview" id="attachments-preview" style="display:none"></div>
    <div class="chat-input-area" id="composer">
      <input id="file-input" type="file" multiple style="display:none" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.rtf,.zip" />
      <button id="attach-btn" type="button" aria-label="Вложение"></button>
      <textarea id="message-input" placeholder="Написать сообщение..." rows="1"></textarea>
      <button id="send-btn">→</button>
    </div>
  </div>
</div>

<div id="msg-menu" class="msg-menu" style="display:none">
  <button type="button" id="msg-menu-pin">Закрепить</button>
  <button type="button" id="msg-menu-edit" style="display:none">Редактировать</button>
  <button type="button" id="msg-menu-fwd">Переслать</button>
  <button type="button" id="msg-menu-del" style="display:none">Удалить</button>
  <button type="button" id="msg-menu-cancel">Копировать</button>
</div>

<div id="dialog-menu" class="msg-menu" style="display:none">
  <button type="button" id="dialog-menu-del">Удалить чат</button>
  <button type="button" id="dialog-menu-cancel">Отмена</button>
</div>

<!-- Scope picker: "у меня" / "у всех" -->
<div id="scope-menu" class="msg-menu" style="display:none">
  <div style="font-size:13px;font-weight:500">Как выполнить?</div>
  <button type="button" id="scope-me">У меня</button>
  <button type="button" id="scope-all">У всех</button>
  <button type="button" id="scope-cancel">Отмена</button>
</div>

<div id="forward-menu" class="msg-menu" style="display:none; gap:10px">
  <div style="font-size:13px;font-weight:500">Переслать в</div>
  <div id="forward-menu-list" style="display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow:auto"></div>
  <button type="button" id="forward-menu-cancel">Отмена</button>
</div>

<!-- User profile (public card) -->
<div class="modal-bg" id="user-card-modal" style="display:none">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <span class="modal-title" id="user-card-title">Профиль</span>
      <button class="modal-close" id="user-card-close">✕</button>
    </div>
    <div id="user-card-body"></div>
  </div>
</div>

<!-- Copy helper (iOS/http-safe) -->
<div class="modal-bg" id="copy-modal" style="display:none">
  <div class="modal" style="width:520px">
    <div class="modal-header">
      <span class="modal-title">Скопируйте текст</span>
      <button class="modal-close" id="copy-close">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="login-sub" style="margin:0">Выделите и скопируйте</div>
      <textarea id="copy-text" readonly style="width:100%;min-height:140px;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;line-height:1.4"></textarea>
      <button type="button" class="chat-link" id="copy-done" style="width:100%">Готово</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js?v=46"></script>
</body>
</html>
