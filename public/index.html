<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>График конного клуба</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#534AB7">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>

<div class="topbar topbar--home">
  <button id="club-brand" type="button" class="club-brand" aria-label="Клуб" title="Клуб">
    <span class="club-logo" id="club-logo-wrap" aria-hidden="true">
      <span class="club-logo-fallback" id="club-logo-fallback">🏇</span>
      <img id="club-logo-img" alt="" style="display:none">
    </span>
  </button>
  <div class="user-info">
    <button type="button" class="profile-btn" data-nav-back aria-label="Назад" title="Назад">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </button>
    <span id="user-name"></span>
    <a href="/admin.html" class="chat-link" id="admin-panel-link" style="display:none">Админка</a>
    <a href="/chat.html" class="profile-btn" aria-label="Чат" title="Чат">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5h16v10H7l-3 3V5z"></path>
      </svg>
    </a>
    <a href="/profile.html" class="profile-btn" aria-label="Профиль" title="Профиль" id="profile-link">
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21a8 8 0 0 0-16 0"></path>
        <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"></path>
      </svg>
    </a>
  </div>
</div>

<div class="modal-bg" id="club-modal" style="display:none">
  <div class="modal" style="width:min(520px, 94vw)">
    <div class="modal-header">
      <span class="modal-title" id="club-modal-title">Клуб</span>
      <button class="modal-close" id="club-modal-close">✕</button>
    </div>
    <div id="club-modal-body" style="font-size:13px;color:#444"></div>
  </div>
</div>

<div class="main-tabs" style="max-width:980px;margin:10px auto 0">
  <a class="main-tab active" href="/">Расписание</a>
  <a class="main-tab" href="/people.html">Люди</a>
  <a class="main-tab" href="/horses.html">Лошади</a>
</div>

<div class="schedule-wrap" style="max-width:980px;margin:0 auto">
  <div class="login-card" style="width:100%">
    <h2 style="margin-bottom:8px">Площадки</h2>
    <p class="login-sub">Выберите площадку, чтобы открыть календарь</p>
    <div id="venues-list" class="venues-list"></div>
  </div>
</div>

<script src="home.js"></script>
<script src="nav.js"></script>
</body>
</html>
