<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пользователи — Horseclub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <h1>Пользователи</h1>
    <div class="user-info">
      <button type="button" class="profile-btn" data-nav-back aria-label="Назад" title="Назад">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <span id="user-name"></span>
      <a href="/profile.html" class="profile-btn" aria-label="Профиль" title="Профиль">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"></path>
        </svg>
      </a>
    </div>
  </div>

  <div class="schedule-wrap" style="max-width:720px;margin:0 auto">
    <div class="login-card" style="width:100%">
      <h2 style="margin-bottom:8px">Создать пользователя</h2>
      <p class="login-sub">Регистрация закрыта, поэтому аккаунты создаёт администратор</p>

      <div id="err" class="login-error" style="display:none"></div>
      <div id="ok" class="login-success" style="display:none"></div>
      <div id="invite-result" style="display:none;margin-bottom:14px"></div>

      <div class="field">
        <label>Имя и фамилия</label>
        <input id="full_name" type="text" placeholder="Иванова Мария">
      </div>

      <div class="field">
        <label>Логин</label>
        <input id="login" type="text" placeholder="maria-ivanova (можно оставить пустым — сгенерируем)">
      </div>

      <div class="field-row">
        <div class="field" style="margin:0">
          <label>Статус</label>
          <select id="status">
            <option value="" selected>—</option>
            <option value="коневладелец">Коневладелец</option>
            <option value="тренер">Тренер</option>
            <option value="руководитель клуба">Руководитель клуба</option>
            <option value="ветврач">Ветврач</option>
            <option value="конюх">Конюх</option>
            <option value="администратор">Администратор</option>
          </select>
        </div>
        <div class="field" style="margin:0">
          <label>Роль</label>
          <select id="role">
            <option value="user" selected>Пользователь</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:12px">
        <button id="create-btn" style="flex:1;padding:12px 14px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600">Сохранить</button>
        <button id="cancel-create" style="padding:12px 14px;background:#fff;border:1px solid #ddd;border-radius:10px">Отмена</button>
      </div>
    </div>

    <div class="login-card" style="width:100%;margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <h2 style="margin-bottom:8px">Список пользователей</h2>
        <div style="display:flex;align-items:center;gap:8px">
          <select id="users-filter" style="padding:8px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">
            <option value="active" selected>Активные</option>
            <option value="archived">Архив</option>
          </select>
        </div>
      </div>
      <div id="users-list" style="font-size:13px;color:#666"></div>
    </div>

    <div class="login-card" style="width:100%;margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <h2 style="margin-bottom:8px">Инвайты</h2>
        <div style="display:flex;align-items:center;gap:8px">
          <select id="invites-filter" style="padding:8px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">
            <option value="active" selected>Активные</option>
            <option value="all">Все</option>
          </select>
          <button id="invites-refresh-btn" style="padding:8px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">Обновить</button>
        </div>
      </div>
      <div class="login-sub" style="margin-bottom:12px">Здесь видны все созданные приглашения. Можно отменить только активные.</div>
      <div id="invites-list" style="font-size:13px;color:#666"></div>
    </div>
  </div>

  <div class="modal-bg" id="user-view-modal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Профиль пользователя</span>
        <button class="modal-close" id="user-view-close">✕</button>
      </div>
      <div id="user-view-body"></div>
      <div class="modal-buttons">
        <button id="user-delete" style="background:#fff;border:1px solid #f0b4b4;color:#A32D2D">В архив</button>
        <button id="user-view-cancel">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="admin-users.js"></script>
  <script src="nav.js"></script>
</body>
</html>
