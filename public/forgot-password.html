<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — Horseclub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <h2>Забыли пароль?</h2>
      <p class="login-sub">Укажите логин. Если для аккаунта включена почта и SMTP на сервере — придёт ссылка для нового пароля.</p>

      <div id="err" class="login-error" style="display:none"></div>

      <div id="form-wrap">
        <div class="field">
          <label>Логин</label>
          <input type="text" id="login-input" placeholder="Ваш логин" autocomplete="username">
        </div>
        <button id="submit-btn">Продолжить</button>
        <p style="margin-top:14px;font-size:13px">
          <a href="/login.html">← Назад ко входу</a>
        </p>
      </div>

      <div id="result-wrap" style="display:none">
        <p id="result-text" style="font-size:14px;line-height:1.45;color:#333;margin-bottom:14px"></p>
        <a href="/login.html" style="display:inline-block;padding:10px 14px;background:#534AB7;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">На страницу входа</a>
      </div>
    </div>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
