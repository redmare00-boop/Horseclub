<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лошади — Horseclub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .horses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .horse-card { background:#fff;border:1px solid rgba(0,0,0,0.06);border-radius:14px;overflow:hidden;cursor:pointer; }
    .horse-photo { position:relative; width:100%;height:150px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden; }
    .horse-photo img { width:100%;height:150px;object-fit:cover;display:block; }
    .horse-owner-badge {
      position:absolute;
      top:10px;
      right:10px;
      max-width: calc(100% - 20px);
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.08);
      color:#333;
      font-size:12px;
      font-weight:600;
      text-decoration:none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .horse-owner-badge:active { transform: scale(0.99); }
    .horse-owner-badge.disabled { cursor: default; opacity: 0.75; }
    .horse-card-body { padding: 12px 12px; }
    .horse-meta { color:#888;font-size:12px;margin:4px 0 10px; }
    .badges { display:flex;flex-wrap:wrap;gap:6px; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 600; border:1px solid rgba(0,0,0,0.06); }
    .ok { background:#E1F5EE;color:#085041; }
    .soon { background:#fff8e1;color:#8a4b00; }
    .due { background:#FCEBEB;color:#A32D2D; }
    .none { background:#f7f7f7;color:#666; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:999; justify-content:center; align-items:flex-start; padding:24px 12px; overflow:auto; }
    .overlay.open { display:flex; }
    .modal { background:#fff; border-radius:14px; width:100%; max-width:720px; }
    .modal-head { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #eee; }
    .modal-head h2 { font-size:14px; margin:0; }
    .modal-body { padding: 16px; }
    .tabs { display:flex; gap:8px; border-bottom:1px solid #eee; margin-bottom:12px; }
    .tab { padding:8px 10px; border:none; background:none; cursor:pointer; color:#777; border-bottom:2px solid transparent; }
    .tab.active { color:#333; border-bottom-color:#534AB7; font-weight:600; }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .form-row { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px; }
    .form-row.full { grid-template-columns: 1fr; }
    label { display:block; font-size:12px; color:#666; margin-bottom:4px; }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:10px; font-size:14px; }
    textarea { min-height: 70px; resize: vertical; }
    .photo-upload-area { border:1px dashed #cfcfcf;border-radius:12px;padding:12px;background:#fafafa;cursor:pointer;text-align:center; }
    .photo-preview-img { width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:8px; display:none; }
    .med-list { display:flex;flex-direction:column;gap:10px; }
    .med-item { background:#fafafa;border:1px solid #eee;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px; }
    .med-type { font-size:12px;font-weight:700; }
    .med-dates { font-size:12px;color:#555;margin-top:2px; }
    .med-sub { font-size:12px;color:#777;margin-top:2px; }
    .btn-del-med { background:none;border:none;color:#bbb;cursor:pointer;font-size:18px; }
    .add-med-form { background:#fafafa;border:1px dashed #ddd;border-radius:12px;padding:12px;margin-top:12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Лошади</h1>
    <div class="user-info">
      <button type="button" class="profile-btn" data-nav-back aria-label="Назад" title="Назад">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <a href="/" class="profile-btn" aria-label="Домой" title="Домой">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5"></path>
          <path d="M5.5 9.5V21h13V9.5"></path>
          <path d="M10 21v-7h4v7"></path>
        </svg>
      </a>
      <a href="/chat.html" class="profile-btn" aria-label="Чат" title="Чат">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16v10H7l-3 3V5z"></path>
        </svg>
      </a>
      <span id="user-name"></span>
      <a href="/profile.html" class="profile-btn" aria-label="Профиль" title="Профиль" id="profile-link">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"></path>
        </svg>
      </a>
    </div>
  </div>

  <div class="schedule-wrap" style="max-width:980px;margin:0 auto">
    <div class="login-card" style="width:100%">
      <div id="err" class="login-error" style="display:none;margin-bottom:10px"></div>
      <div id="ok" class="login-success" style="display:none;margin-bottom:10px"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button type="button" class="btn-ghost active" data-scope="active">Все</button>
          <button type="button" class="btn-ghost" data-scope="mine">Мои</button>
        </div>
        <button type="button" id="add-horse-btn" style="padding:9px 12px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-weight:600">+ Добавить</button>
      </div>
      <div style="margin-top:14px" class="people-list" id="horses-list"></div>
    </div>
  </div>

<!-- Модальное окно -->
<div class="overlay" id="horse-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Новая лошадь</h2>
      <button id="modal-close" type="button" class="btn-ghost">✕</button>
    </div>
    <div class="modal-body">
      <div class="tabs">
        <button class="tab active" id="tab-info-btn" type="button" data-tab="info">Основное</button>
        <button class="tab" id="tab-med-btn" type="button" data-tab="medical">Ветпроцедуры</button>
      </div>

      <div class="tab-panel active" id="tab-info">
        <input type="hidden" id="horse-id">
        <div class="form-row">
          <div><label>Кличка *</label><input id="f-name" placeholder="Буран"></div>
          <div><label>Масть *</label><input id="f-color" placeholder="Гнедой"></div>
        </div>
        <div class="form-row">
          <div>
            <label>Пол *</label>
            <select id="f-sex">
              <option value="" selected>—</option>
              <option value="кобыла">Кобыла</option>
              <option value="жеребец">Жеребец</option>
              <option value="мерин">Мерин</option>
            </select>
          </div>
          <div><label>Год рождения *</label><input id="f-year" type="number" placeholder="2018"></div>
        </div>
        <div class="form-row">
          <div><label>Номер чипа</label><input id="f-chip" placeholder="123456789012345"></div>
          <div><label>Номер паспорта</label><input id="f-passport" placeholder="RUS 001234"></div>
        </div>
        <div class="form-row full">
          <div>
            <label>Владелец *</label>
            <select id="f-owner-user"></select>
            <div style="margin-top:6px;font-size:12px;color:#666">Открыть владельца: <span id="horse-owner-link">—</span></div>
          </div>
        </div>
        <div class="form-row full">
          <div>
            <label>Фото</label>
            <div class="photo-upload-area" id="photo-pick">
              <img id="photo-img" class="photo-preview-img" src="" alt="Фото лошади">
              <div id="photo-placeholder">📷 Нажмите чтобы выбрать фото</div>
            </div>
            <input type="file" id="f-photo" accept="image/*" style="display:none">
          </div>
        </div>
        <div class="form-row full">
          <div><label>Заметки</label><textarea id="f-notes" placeholder="Особенности, аллергии..."></textarea></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button id="save-btn" type="button" style="padding:9px 12px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-weight:600">Сохранить</button>
          <button type="button" class="btn-ghost" id="btn-delete" style="border:1px solid #f0b4b4;color:#A32D2D">Удалить</button>
        </div>
      </div>

      <div class="tab-panel" id="tab-medical">
        <div class="med-list" id="med-list">
          <div style="color:#aaa;font-size:.85rem;">Сначала сохраните лошадь</div>
        </div>
        <button class="btn-ghost" id="btn-toggle-med" style="display:none;margin-top:12px">+ Добавить запись</button>
        <div class="add-med-form" id="add-med-form" style="display:none;">
          <div style="font-weight:600;color:#333;margin-bottom:10px">Новая запись</div>
          <div class="form-row">
            <div>
              <label>Раздел</label>
              <select id="m-type">
                <option value="vaccination">💉 Вакцинации</option>
                <option value="deworming">🔬 Дегельминтизация</option>
                <option value="hoof_care">🔧 Расчистка / ковка</option>
              </select>
            </div>
            <div><label>Дата *</label><input id="m-date" type="date"></div>
          </div>
          <div class="form-row full" id="m-desc-row">
            <div>
              <label id="m-desc-label">От чего (название прививки) *</label>
              <input id="m-desc" placeholder="Напр. грипп/столбняк">
            </div>
          </div>
          <div class="form-row full" id="m-hoof-row" style="display:none">
            <div>
              <label>Вид *</label>
              <select id="m-hoof-kind">
                <option value="trim" selected>Расчистка</option>
                <option value="shoeing">Ковка</option>
              </select>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
            <button id="btn-med-save" type="button" style="padding:9px 12px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-weight:600">Добавить</button>
            <button id="btn-med-cancel" type="button" class="btn-ghost">Отмена</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Crop photo modal -->
<div class="overlay" id="crop-modal" style="z-index:1000">
  <div class="modal" style="max-width:520px">
    <div class="modal-head">
      <h2>Кадрирование (1:1)</h2>
      <button id="crop-close" type="button" class="btn-ghost">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;justify-content:center">
        <canvas id="crop-canvas" width="320" height="320" style="border-radius:14px;border:1px solid #eee;background:#f6f6f6;touch-action:none"></canvas>
      </div>
      <div style="margin-top:12px">
        <label>Масштаб</label>
        <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button id="crop-apply" type="button" style="padding:9px 12px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-weight:600">Готово</button>
        <button id="crop-cancel" type="button" class="btn-ghost">Отмена</button>
      </div>
      <div style="margin-top:10px;font-size:12px;color:#777">Перетаскивайте фото пальцем/мышкой, чтобы выбрать кадр.</div>
    </div>
  </div>
</div>
<script src="nav.js"></script>
<script src="horses.js"></script>
</body>
</html>
